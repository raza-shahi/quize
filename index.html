<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quize Practice questions</title>
  <link rel="stylesheet" href="./newStyle.css">
</head>

<body>
  <div class="quize-container" id="quize-container">
    <h1>Welcome to Quize Practice</h1>
    <div class="sections">
      <div class="section" data-section="0">Genral Knowledge</div>
      <div class="section" data-section="1">Mathematics</div>
      <div class="section" data-section="2">Indian History</div>
      <div class="section" data-section="3">Science</div>
    </div>
  </div>
  <div class="question-container" id="question-container" style="display: none;">
    <p id="score">Score: 0</p>
    <div class="question" id="qes"></div>
    <div class="options" id="option"></div>
    <div id="next-btn">
      <button>Next</button>
    </div>
  </div>

  <script src="./myScript.js"></script>
</body>

</html>
